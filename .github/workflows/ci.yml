name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # Lint is a hard gate: the repo is at 0 errors (warnings allowed).
      - name: Lint
        run: npm run lint

      # Type check is informational until the checkJs debt (~1200 errors) is paid down.
      - name: Type check
        run: npm run typecheck
        continue-on-error: true
